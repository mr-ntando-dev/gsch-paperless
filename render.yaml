services:
  - type: web
    name: gsch-paperless
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gsch-paperless-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: NODE_ENV
        value: production

databases:
  - name: gsch-paperless-db
    plan: free
    databaseName: gsch_paperless
    user: gsch_admin
    region: oregon
